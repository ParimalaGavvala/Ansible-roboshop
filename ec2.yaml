- name: create ec2 server and route 53 records
  hosts: local
  connection: local
  vars:
   AMI_ID: "ami-0220d79f3f480ecf5"
   SG_ID: "sg-024615259cce53783"
   SUBNET_ID: "subnet-05c4a4cfde07e90fd"
   HOSTED_ZONE: "Z09903499ZOCINV74DX5"
   DOMAIN_NAME: "devsecopsdaws-86s.fun"
   instances: 
    - mongodb
  tasks:
   - name: create EC2 Instance
     amazon.aws.ec2_instance:
       name: "{{ item }}"
       vpc_subnet_id: "{{ SUBNET_ID }}"
       instance_type: t2.micro
       security_group: "{{ SG_ID }}"
       image_id: "{{ AMI_ID }}"
       tags:
         Name: "{{ item }}"
     loop: "{{ instances }}"
     register: ec2_output

  #  - name: print the ec2-output
  #    ansible.builtin.debug:
  #      msg: "{{ ec2_output }}"    

  #  - name: print public_ip_address 
  #    ansible.builtin.debug: 
  #       msg: "{{item.instances[0].public_ip_address}}"
  #    loop: "{{ ec2_output.results }}"

  #  - name: print private_ipaddress 
  #    ansible.builtin.debug: 
  #      msg: "{{item.instances[0].private_ip_address}}"
  #    loop: "{{ ec2_output.results }}"

   - name: create the route 53 records
     amazon.aws.route53:
       state: present
       zone: "{{ DOMAIN_NAME }}"
       record: "{{ item.item }}.{{ DOMAIN_NAME }}"
       type: A
       ttl: 1
       value: "{{item.instances[0].private_ip_address}}"
       overwrite: true
     loop: "{{ ec2_output.results }}"